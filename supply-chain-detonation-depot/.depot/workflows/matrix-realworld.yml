name: Real-world matrix — npm install axios on a fresh project

# Mirrors what a developer does when they add `axios` to their project:
# diff base lockfile (empty deps) vs head lockfile (axios + 26
# transitive deps), then detonate just the DIRECT dep (axios). One
# `npm install axios` inside the FC guest exercises the install
# scripts of all 27 packages in a single fingerprint, so we don't
# need to detonate each transitive separately.
#
# This is the realistic per-PR shape: "someone bumped a top-level
# dep; tell me what its install actually did."
#
# Fixtures generated locally with:
#   mkdir realproj && cd realproj
#   npm init -y                         # captured as base.json
#   npm install --package-lock-only axios   # captured as head.json

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    container:
      image: registry.depot.dev/lmpn2xx8kz:detonation-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --device=/dev/net/tun
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --cap-add=NET_RAW
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Verify image
        run: |
          set -eux
          ls -l /dev/kvm /dev/net/tun
          firecracker --version
          ls -lh /opt/lockfile-fixtures/realworld-axios/

      - name: Compute direct added/bumped packages
        run: |
          set -eux
          python3 /opt/lockfile_diff.py --direct \
            /opt/lockfile-fixtures/realworld-axios/base.json \
            /opt/lockfile-fixtures/realworld-axios/head.json \
            | tee /tmp/added.txt
          echo "--- $(wc -l </tmp/added.txt) direct package(s) to detonate ---"
          echo "--- (transitives implicitly covered by each `npm install <direct>`) ---"
          echo "--- full transitive set this brings in: ---"
          python3 /opt/lockfile_diff.py \
            /opt/lockfile-fixtures/realworld-axios/base.json \
            /opt/lockfile-fixtures/realworld-axios/head.json \
            | wc -l
          echo "packages added end-to-end."

      - name: Detonate + verify each direct package
        run: |
          set -uo pipefail
          declare -A status duration_ms verdict_note
          mkdir -p /tmp/matrix

          while read -r spec; do
            [[ -z "$spec" ]] && continue
            slug="$(echo "$spec" | tr '/@:' '___')"
            log="/tmp/matrix/$slug.log"
            fp="/tmp/matrix/$slug.fp.json"

            echo
            echo "============================================================"
            echo "== $spec  (running npm install in a fresh FC microVM)"
            echo "============================================================"

            t0=$(date +%s)
            bash /opt/run_detonation.sh \
              /opt/guest/vmlinux /opt/guest/initrd.cpio "$spec" 2>&1 \
              | tee "$log" || true
            duration_ms["$spec"]=$(( ($(date +%s) - t0) * 1000 ))

            awk '/DETONATION_BEGIN/{p=1;next} /DETONATION_END/{exit} p' "$log" \
              | tr -d '\r' > "$fp.raw" || true
            if [[ ! -s "$fp.raw" ]]; then
              status["$spec"]=FAIL
              verdict_note["$spec"]="no DETONATION markers"
              continue
            fi
            jq '. + { verdict: (if .exit_status == 0 then "OK" else "FAIL" end) }' \
                "$fp.raw" > "$fp"

            exit_status=$(jq -r '.exit_status' "$fp")
            if [[ "$exit_status" != "0" ]]; then
              status["$spec"]=FAIL
              verdict_note["$spec"]="npm exit=$exit_status"
              continue
            fi

            baseline="/opt/baselines/${spec}.json"
            if [[ ! -f "$baseline" ]]; then
              status["$spec"]=NEW
              verdict_note["$spec"]="no baseline — commit one after review"
              echo
              echo "  [captured fingerprint for $spec]"
              jq . "$fp"
              continue
            fi
            if python3 /opt/diff_fingerprint.py "$fp" "$baseline" > "/tmp/matrix/$slug.diff.json"; then
              status["$spec"]=PASS
              verdict_note["$spec"]=""
            else
              status["$spec"]=DIFF
              ue=$(jq -r '.unknown_execve_targets | length' "/tmp/matrix/$slug.diff.json")
              uc=$(jq -r '.unknown_connect_peers | length' "/tmp/matrix/$slug.diff.json")
              verdict_note["$spec"]="unknown execve=$ue connect=$uc"
            fi
          done </tmp/added.txt

          echo
          echo "============================================================"
          echo "== Per-direct-dep matrix (real-world axios install)"
          echo "============================================================"
          printf '  %-32s %-6s %-10s %s\n' PACKAGE STATUS WALL_MS NOTE
          printf '  %-32s %-6s %-10s %s\n' ------- ------ ------- ----
          fail=0
          while read -r spec; do
            [[ -z "$spec" ]] && continue
            s="${status[$spec]:-?}"
            printf '  %-32s %-6s %-10s %s\n' "$spec" "$s" \
              "${duration_ms[$spec]:-?}ms" \
              "${verdict_note[$spec]:-}"
            [[ "$s" == "PASS" ]] || fail=1
          done </tmp/added.txt

          if (( fail )); then
            echo "OVERALL: at least one direct dep did not PASS (would block PR)"
            exit 1
          fi
          echo "OVERALL: all direct deps PASS"
