name: Real-world matrix — npm install axios on a fresh project

# Mirrors what a developer does when they add `axios` to their project:
# diff base lockfile (empty deps) vs head lockfile (axios + 26
# transitive deps), then detonate just the DIRECT dep (axios). One
# `npm install axios` inside the FC guest exercises the install
# scripts of all 27 packages in a single fingerprint, so we don't
# need to detonate each transitive separately.
#
# This is the realistic per-PR shape: "someone bumped a top-level
# dep; tell me what its install actually did."
#
# Fixtures generated locally with:
#   mkdir realproj && cd realproj
#   npm init -y                         # captured as base.json
#   npm install --package-lock-only axios   # captured as head.json

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    container:
      image: registry.depot.dev/lmpn2xx8kz:detonation-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --device=/dev/net/tun
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --cap-add=NET_RAW
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Verify image
        run: |
          set -eux
          ls -l /dev/kvm /dev/net/tun
          firecracker --version
          ls -lh /opt/lockfile-fixtures/realworld-axios/

      - name: Compute direct added/bumped packages
        run: |
          set -eux
          python3 /opt/lockfile_diff.py --direct \
            /opt/lockfile-fixtures/realworld-axios/base.json \
            /opt/lockfile-fixtures/realworld-axios/head.json \
            | tee /tmp/added.txt
          echo "--- $(wc -l </tmp/added.txt) direct package(s) to detonate ---"
          echo "--- (transitives implicitly covered by each `npm install <direct>`) ---"
          echo "--- full transitive set this brings in: ---"
          python3 /opt/lockfile_diff.py \
            /opt/lockfile-fixtures/realworld-axios/base.json \
            /opt/lockfile-fixtures/realworld-axios/head.json \
            | wc -l
          echo "packages added end-to-end."

      - name: Detonate + verify each direct package (parallel)
        env:
          PARALLEL: "8"
        run: |
          set -uo pipefail
          mkdir -p /tmp/matrix
          t0_wall=$(date +%s)

          # Each xargs child runs detonate_one.sh with its own
          # subshell PID as INST_ID, which keeps TAP/IP/MAC namespaces
          # disjoint across concurrent FC microVMs on this runner.
          # detonate_one.sh always exits 0; pass/fail is recorded in
          # per-package .status files for aggregation below.
          xargs -a /tmp/added.txt -P "$PARALLEL" -I{} \
            bash -c 'bash /opt/detonate_one.sh "$1" "$$"' _ {}

          wall_ms=$(( ($(date +%s) - t0_wall) * 1000 ))

          echo
          echo "============================================================"
          echo "== Per-direct-dep matrix (real-world axios install, parallel=$PARALLEL)"
          echo "============================================================"
          printf '  %-32s %-6s %-10s %s\n' PACKAGE STATUS WALL_MS NOTE
          printf '  %-32s %-6s %-10s %s\n' ------- ------ ------- ----
          fail=0
          sum_ms=0
          n=0
          while read -r spec; do
            [[ -z "$spec" ]] && continue
            slug="$(echo "$spec" | tr '/@:' '___')"
            s=$(cat "/tmp/matrix/$slug.status" 2>/dev/null || echo '?')
            d=$(cat "/tmp/matrix/$slug.duration_ms" 2>/dev/null || echo '?')
            note=$(cat "/tmp/matrix/$slug.note" 2>/dev/null || echo '')
            printf '  %-32s %-6s %-10s %s\n' "$spec" "$s" "${d}ms" "$note"
            [[ "$s" == "PASS" ]] || fail=1
            [[ "$d" =~ ^[0-9]+$ ]] && { sum_ms=$((sum_ms + d)); n=$((n + 1)); }
            # Print captured fingerprint for NEW so reviewers can copy it
            if [[ "$s" == "NEW" ]]; then
              echo
              echo "  [captured fingerprint for $spec]"
              jq . "/tmp/matrix/$slug.fp.json" 2>/dev/null || true
            fi
          done </tmp/added.txt

          echo
          if (( n > 0 )); then
            speedup=$(awk -v s="$sum_ms" -v w="$wall_ms" \
              'BEGIN { if (w==0) print "n/a"; else printf "%.1fx", s/w }')
            echo "TIMING: serial_sum=${sum_ms}ms  wall_clock=${wall_ms}ms  speedup=${speedup}  workers=$PARALLEL"
          fi

          if (( fail )); then
            echo "OVERALL: at least one direct dep did not PASS (would block PR)"
            exit 1
          fi
          echo "OVERALL: all direct deps PASS"
