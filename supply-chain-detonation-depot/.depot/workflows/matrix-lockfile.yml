name: Matrix-detonate every added/bumped package in a lockfile diff (Stage 3)

# Reads two package-lock.json snapshots (in production: base vs HEAD
# of the PR; here: lockfile-fixtures/base.json vs head.json baked into
# the runner image), extracts the set of added or version-bumped
# packages, then for each one runs Stage 1's detonation + Stage 2's
# fingerprint-vs-baseline diff. Emits a per-package summary table and
# fails the workflow if any package is non-PASS.
#
# Per-package status:
#   PASS  baseline exists and the captured fingerprint matches.
#   DIFF  baseline exists, fingerprint mutated. Block the PR.
#   NEW   no baseline committed. Block the PR until a maintainer
#         reviews + commits one.
#   FAIL  detonation itself failed (npm install errored).

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.depot.dev/lmpn2xx8kz:detonation-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --device=/dev/net/tun
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --cap-add=NET_RAW
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Verify image
        run: |
          set -eux
          ls -l /dev/kvm /dev/net/tun
          firecracker --version
          ls -lh /opt/guest/ /opt/baselines/ /opt/lockfile-fixtures/

      - name: Compute added/bumped packages from the lockfile diff
        run: |
          set -eux
          python3 /opt/lockfile_diff.py \
            /opt/lockfile-fixtures/base.json \
            /opt/lockfile-fixtures/head.json \
            | tee /tmp/added.txt
          echo "--- $(wc -l </tmp/added.txt) packages to detonate ---"

      - name: Detonate + verify each package (parallel)
        env:
          PARALLEL: "8"
        run: |
          set -uo pipefail
          mkdir -p /tmp/matrix
          t0_wall=$(date +%s)

          # Fan out: each xargs child runs detonate_one.sh with its
          # own subshell PID as INST_ID, keeping per-VM TAP/IP/MAC
          # namespaces disjoint. detonate_one.sh always exits 0;
          # status is recorded per-package for aggregation below.
          xargs -a /tmp/added.txt -P "$PARALLEL" -I{} \
            bash -c 'bash /opt/detonate_one.sh "$1" "$$"' _ {}

          wall_ms=$(( ($(date +%s) - t0_wall) * 1000 ))

          echo
          echo "============================================================"
          echo "== Per-package matrix (parallel=$PARALLEL)"
          echo "============================================================"
          printf '  %-32s %-6s %-10s %s\n' PACKAGE STATUS WALL_MS NOTE
          printf '  %-32s %-6s %-10s %s\n' ------- ------ ------- ----
          fail=0
          sum_ms=0
          n=0
          while read -r spec; do
            [[ -z "$spec" ]] && continue
            slug="$(echo "$spec" | tr '/@:' '___')"
            s=$(cat "/tmp/matrix/$slug.status" 2>/dev/null || echo '?')
            d=$(cat "/tmp/matrix/$slug.duration_ms" 2>/dev/null || echo '?')
            note=$(cat "/tmp/matrix/$slug.note" 2>/dev/null || echo '')
            printf '  %-32s %-6s %-10s %s\n' "$spec" "$s" "${d}ms" "$note"
            [[ "$s" == "PASS" ]] || fail=1
            [[ "$d" =~ ^[0-9]+$ ]] && { sum_ms=$((sum_ms + d)); n=$((n + 1)); }
          done </tmp/added.txt

          echo
          if (( n > 0 )); then
            speedup=$(awk -v s="$sum_ms" -v w="$wall_ms" \
              'BEGIN { if (w==0) print "n/a"; else printf "%.1fx", s/w }')
            echo "TIMING: serial_sum=${sum_ms}ms  wall_clock=${wall_ms}ms  speedup=${speedup}  workers=$PARALLEL"
          fi

          if (( fail )); then
            echo "OVERALL: at least one package did not PASS"
            exit 1
          fi
          echo "OVERALL: all packages PASS"
