name: Matrix-detonate every added/bumped package in a lockfile diff (Stage 3)

# Reads two package-lock.json snapshots (in production: base vs HEAD
# of the PR; here: lockfile-fixtures/base.json vs head.json baked into
# the runner image), extracts the set of added or version-bumped
# packages, then for each one runs Stage 1's detonation + Stage 2's
# fingerprint-vs-baseline diff. Emits a per-package summary table and
# fails the workflow if any package is non-PASS.
#
# Per-package status:
#   PASS  baseline exists and the captured fingerprint matches.
#   DIFF  baseline exists, fingerprint mutated. Block the PR.
#   NEW   no baseline committed. Block the PR until a maintainer
#         reviews + commits one.
#   FAIL  detonation itself failed (npm install errored).

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.depot.dev/lmpn2xx8kz:detonation-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --device=/dev/net/tun
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --cap-add=NET_RAW
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Verify image
        run: |
          set -eux
          ls -l /dev/kvm /dev/net/tun
          firecracker --version
          ls -lh /opt/guest/ /opt/baselines/ /opt/lockfile-fixtures/

      - name: Compute added/bumped packages from the lockfile diff
        run: |
          set -eux
          python3 /opt/lockfile_diff.py \
            /opt/lockfile-fixtures/base.json \
            /opt/lockfile-fixtures/head.json \
            | tee /tmp/added.txt
          echo "--- $(wc -l </tmp/added.txt) packages to detonate ---"

      - name: Detonate + verify each package
        run: |
          set -uo pipefail
          declare -A status duration_ms verdict_note

          mkdir -p /tmp/matrix
          while read -r spec; do
            [[ -z "$spec" ]] && continue
            slug="$(echo "$spec" | tr '/@:' '___')"
            log="/tmp/matrix/$slug.log"
            fp="/tmp/matrix/$slug.fp.json"

            echo
            echo "============================================================"
            echo "== $spec"
            echo "============================================================"

            # Detonate (Stage 1)
            t0=$(date +%s)
            if ! bash /opt/run_detonation.sh \
                   /opt/guest/vmlinux \
                   /opt/guest/initrd.cpio \
                   "$spec" 2>&1 | tee "$log"; then
              :
            fi
            duration_ms["$spec"]=$(( ($(date +%s) - t0) * 1000 ))

            awk '/DETONATION_BEGIN/{p=1;next} /DETONATION_END/{exit} p' "$log" \
              | tr -d '\r' > "$fp.raw" || true
            if [[ ! -s "$fp.raw" ]]; then
              status["$spec"]=FAIL
              verdict_note["$spec"]="no DETONATION markers"
              continue
            fi
            jq '. + { verdict: (if .exit_status == 0 then "OK" else "FAIL" end) }' \
                "$fp.raw" > "$fp"

            exit_status=$(jq -r '.exit_status' "$fp")
            if [[ "$exit_status" != "0" ]]; then
              status["$spec"]=FAIL
              verdict_note["$spec"]="exit_status=$exit_status"
              continue
            fi

            # Baseline lookup. Filenames use `@` literally because the
            # `package@version` convention is itself the key.
            baseline="/opt/baselines/${spec}.json"
            if [[ ! -f "$baseline" ]]; then
              status["$spec"]=NEW
              verdict_note["$spec"]="no baseline committed"
              continue
            fi

            # Stage 2 diff
            if python3 /opt/diff_fingerprint.py "$fp" "$baseline" > "/tmp/matrix/$slug.diff.json"; then
              status["$spec"]=PASS
              verdict_note["$spec"]=""
            else
              status["$spec"]=DIFF
              ue=$(jq -r '.unknown_execve_targets | length' "/tmp/matrix/$slug.diff.json")
              uc=$(jq -r '.unknown_connect_peers | length' "/tmp/matrix/$slug.diff.json")
              verdict_note["$spec"]="unknown execve=$ue connect=$uc"
            fi
          done </tmp/added.txt

          echo
          echo "============================================================"
          echo "== Per-package matrix"
          echo "============================================================"
          printf '  %-32s %-6s %-10s %s\n' PACKAGE STATUS WALL_MS NOTE
          printf '  %-32s %-6s %-10s %s\n' ------- ------ ------- ----
          fail=0
          while read -r spec; do
            [[ -z "$spec" ]] && continue
            s="${status[$spec]:-?}"
            printf '  %-32s %-6s %-10s %s\n' "$spec" "$s" \
              "${duration_ms[$spec]:-?}ms" \
              "${verdict_note[$spec]:-}"
            [[ "$s" == "PASS" ]] || fail=1
          done </tmp/added.txt

          if (( fail )); then
            echo "OVERALL: at least one package did not PASS"
            exit 1
          fi
          echo "OVERALL: all packages PASS"
