name: Attack simulation — synthesize compromised-package fingerprints, run the gate

# Demonstrates what the gate output looks like when a PR bumps a
# dep to a malicious version. We DO NOT run the actual compromised
# packages — there's no value in pulling adversary tooling into a
# managed-CI runner just for a demo, and the malicious versions are
# already removed from the registry. Instead we hand-craft fingerprints
# that match the DOCUMENTED IoCs of two real 2026 attacks:
#
#   1. axios@1.14.1 / 0.30.4 — March 2026, DPRK/UNC1069/Sapphire Sleet,
#      C2 sfrclak.com:8000 (142.11.206.73:8000). Per Elastic Security
#      Labs writeup 1 April 2026.
#
#   2. node-ipc@12.0.1 — May 14 2026, C2 sh.azurestaticprovider.net:443
#      (37.16.75.69:443). Notable because the C2 uses port 443
#      specifically to blend with legitimate registry HTTPS traffic
#      — port-based filtering wouldn't help; IP-or-hostname-based
#      allowlisting is what catches it.
#
# Expected gate output for each: DIFF with all signal classes (execve,
# connect, openat) calling out unknown items, exit 1, "would block PR".
#
# Concretely the synthetic fingerprint contains:
#   - /bin/sh and /usr/bin/curl in execve_targets — the postinstall
#     reportedly forks a shell to fetch a second-stage payload
#   - 142.11.206.73:8000 in connect_peers — the published C2 IP
#     for sfrclak.com:8000 (also Telegram & Pastebin variants in the
#     same campaign)
#   - /etc/cron.d/sysupdate and /root/.ssh/authorized_keys in
#     openat_writes — canonical persistence locations (the published
#     writeups note shell-init and cron drops; we pick the two most
#     commonly seen patterns rather than tying to a single sample)
#
# Expected gate output: DIFF with all three signal classes
# (execve, connect, openat) calling out unknown items, exit 1,
# "would block PR".

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  attack:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    container:
      image: registry.depot.dev/lmpn2xx8kz:detonation-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
    steps:
      - name: Verify image (no microVM needed for the gate check)
        run: |
          set -eux
          ls -lh /opt/diff_fingerprint.py /opt/baselines/axios@1.16.1.json

      - name: Write synthetic fingerprint matching axios@1.14.1 IoCs
        run: |
          set -eu
          mkdir -p /tmp/attack
          cat > /tmp/attack/axios_1.14.1.fp.json <<'EOF'
          {
            "package": "axios@1.14.1",
            "exit_status": 0,
            "duration_ms": 6234,
            "boot_to_install_ms": 162,
            "events_total": 1148,
            "ringbuf_drops": 0,
            "execve_targets": [
              "/usr/local/sbin/npm",
              "/usr/local/bin/npm",
              "/usr/sbin/npm",
              "/usr/bin/npm",
              "/usr/local/sbin/node",
              "/usr/local/bin/node",
              "/usr/sbin/node",
              "/usr/bin/node",
              "/bin/sh",
              "/usr/bin/curl"
            ],
            "connect_peers": [
              "127.0.0.1:65535",
              "0:0:0:0:0:0:0:1:65535",
              "104.16.2.34:443",
              "142.11.206.73:8000"
            ],
            "openat_writes": [
              "/etc/cron.d/sysupdate",
              "/root/.ssh/authorized_keys"
            ],
            "openat_under_install": 1083,
            "verdict": "OK"
          }
          EOF
          echo "--- synthetic fingerprint ---"
          jq . /tmp/attack/axios_1.14.1.fp.json

      - name: Run the gate against axios baseline
        run: |
          set -uo pipefail
          echo "--- baseline ---"
          jq '{package, captured_from_run, execve_targets_allowlist, connect_peers_allowlist}' \
            /opt/baselines/axios@1.16.1.json

          echo
          echo "--- gate output (diff_fingerprint.py) ---"
          if python3 /opt/diff_fingerprint.py \
                /tmp/attack/axios_1.14.1.fp.json \
                /opt/baselines/axios@1.16.1.json \
              > /tmp/attack/diff.json; then
            echo
            echo "============================================================"
            echo "GATE OUTPUT: PASS  (THIS IS THE WRONG ANSWER — TEST IS BROKEN)"
            echo "============================================================"
            jq . /tmp/attack/diff.json
            exit 1
          fi

          echo
          jq . /tmp/attack/diff.json
          echo
          echo "============================================================"
          echo "AXIOS@1.14.1 GATE OUTPUT: DIFF — would BLOCK the PR"
          echo "============================================================"
          ue=$(jq -r '.unknown_execve_targets    | length' /tmp/attack/diff.json)
          uc=$(jq -r '.unknown_connect_peers      | length' /tmp/attack/diff.json)
          uo=$(jq -r '.unknown_openat_writes      | length' /tmp/attack/diff.json)
          echo "  unknown execve targets: $ue"
          jq -r '.unknown_execve_targets[]'   /tmp/attack/diff.json | sed 's/^/    /'
          echo "  unknown connect peers:  $uc"
          jq -r '.unknown_connect_peers[]'    /tmp/attack/diff.json | sed 's/^/    /'
          echo "  unknown openat writes:  $uo"
          jq -r '.unknown_openat_writes[]'    /tmp/attack/diff.json | sed 's/^/    /'
          echo
          echo "Indicators of compromise (per Elastic Security Labs, 1 April 2026):"
          echo "  - Shell spawn + curl during npm install (axios is pure-JS,"
          echo "    no postinstall in any clean version)"
          echo "  - TCP egress to 142.11.206.73:8000 — C2 for sfrclak.com"
          echo "  - Persistence writes to /etc/cron.d/* and ~/.ssh/authorized_keys"
          echo "  - Attributed to UNC1069 / Sapphire Sleet (DPRK-aligned)"

      - name: Write synthetic fingerprint matching node-ipc@12.0.1 IoCs
        run: |
          set -eu
          # node-ipc compromise: C2 over port 443 (looks like normal
          # HTTPS), no shell spawn (the payload is JS — uses node's
          # built-in `https` module so curl/sh never get exec'd).
          # The signal that catches it is the connect destination IP,
          # not the port or the binaries. With our hostname allowlist
          # for registry.npmjs.org, 37.16.75.69 doesn't resolve from
          # an allowed hostname and lands as unknown.
          cat > /tmp/attack/node-ipc_12.0.1.fp.json <<'EOF'
          {
            "package": "node-ipc@12.0.1",
            "exit_status": 0,
            "duration_ms": 4892,
            "boot_to_install_ms": 178,
            "events_total": 1204,
            "ringbuf_drops": 0,
            "execve_targets": [
              "/usr/local/sbin/npm",
              "/usr/local/bin/npm",
              "/usr/sbin/npm",
              "/usr/bin/npm",
              "/usr/local/sbin/node",
              "/usr/local/bin/node",
              "/usr/sbin/node",
              "/usr/bin/node"
            ],
            "connect_peers": [
              "127.0.0.1:65535",
              "0:0:0:0:0:0:0:1:65535",
              "104.16.5.34:443",
              "37.16.75.69:443"
            ],
            "openat_writes": [],
            "openat_under_install": 1098,
            "verdict": "OK"
          }
          EOF
          # The DNS map for node-ipc would contain registry.npmjs.org
          # → Cloudflare IPs (legit). 37.16.75.69 doesn't appear
          # because the attacker hardcoded the IP (or used a
          # non-A-record path) to avoid leaving a DNS trail.
          cat > /tmp/attack/node-ipc_dns_map.json <<'EOF'
          {
            "104.16.5.34": ["registry.npmjs.org"]
          }
          EOF
          echo "--- synthetic fingerprint ---"
          jq . /tmp/attack/node-ipc_12.0.1.fp.json
          echo "--- synthetic DNS map ---"
          jq . /tmp/attack/node-ipc_dns_map.json

      - name: Run the gate against node-ipc baseline
        run: |
          set -uo pipefail
          echo "--- baseline ---"
          jq '{package, connect_peers_allowlist}' \
            /opt/baselines/node-ipc@9.2.1.json

          echo
          echo "--- gate output (diff_fingerprint.py with DNS map) ---"
          if python3 /opt/diff_fingerprint.py \
                --dns-map /tmp/attack/node-ipc_dns_map.json \
                /tmp/attack/node-ipc_12.0.1.fp.json \
                /opt/baselines/node-ipc@9.2.1.json \
              > /tmp/attack/diff-nodeipc.json; then
            echo
            echo "============================================================"
            echo "GATE OUTPUT: PASS  (THIS IS THE WRONG ANSWER — TEST IS BROKEN)"
            echo "============================================================"
            jq . /tmp/attack/diff-nodeipc.json
            exit 1
          fi
          echo
          jq . /tmp/attack/diff-nodeipc.json
          echo
          echo "============================================================"
          echo "NODE-IPC@12.0.1 GATE OUTPUT: DIFF — would BLOCK the PR"
          echo "============================================================"
          uc=$(jq -r '.unknown_connect_peers | length' /tmp/attack/diff-nodeipc.json)
          echo "  unknown connect peers:  $uc"
          jq -r '.unknown_connect_peers[]' /tmp/attack/diff-nodeipc.json | sed 's/^/    /'
          echo
          echo "  matched_connect_peers (registry, allowed):"
          jq -r '.matched_connect_peers[] | "    \(.peer) → \(.matched_label)"' \
            /tmp/attack/diff-nodeipc.json
          echo
          echo "Indicators of compromise (per StepSecurity, 14 May 2026):"
          echo "  - TCP egress to 37.16.75.69:443 — C2 for sh.azurestaticprovider.net"
          echo "  - C2 deliberately uses port 443 to blend with registry HTTPS;"
          echo "    a port-based filter would not have caught this. The gate"
          echo "    fires because the IP doesn't resolve from an allowlisted"
          echo "    hostname (registry.npmjs.org) in the DNS map for this run."
          echo "  - No /bin/sh execve — payload uses node's built-in https"
          echo "    module, no shell needed; execve channel stays clean."
          echo
          echo "Gate result: DETECTED.  Expected: DIFF."
