id: ap-python-len-truthiness
name: len(x) == 0 / len(x) != 0 instead of truthiness
category: algorithmic
language: python
promotion: anti-pattern
trigger:
  ast_pattern: '\blen\s*\([^)]+\)\s*(==|!=)\s*0\b'
  profile_signature:
    - "hot:truthiness-check"
transformation:
  steps:
    - "`if not x:` is faster AND more idiomatic than `if len(x) == 0:` for lists / dicts / sets / strings. It avoids the CALL opcode and the `len` builtin lookup."
    - "Same for `if x:` vs `if len(x) > 0:`. The interpreter has a TRUTHY check that skips the method dispatch."
