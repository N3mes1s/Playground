id: ap-go-defer-in-loop
name: defer inside a tight loop
category: algorithmic
language: go
promotion: anti-pattern
trigger:
  ast_pattern: 'for\s+[^{]+\{[^}]*\bdefer\s+'
  profile_signature:
    - "hot:defer-schedule-per-iteration"
transformation:
  steps:
    - "`defer` inside a loop defers cleanup until function return, so resources pile up and every iteration pays the scheduling cost."
    - "Move the cleanup inline (explicit `Close()` at end of iteration) or extract the loop body into a helper function where `defer` fires per iteration."
