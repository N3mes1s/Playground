id: ap-python-range-len
name: range(len(x)) used for indexed iteration
category: algorithmic
language: python
promotion: anti-pattern
trigger:
  ast_pattern: 'for\s+\w+\s+in\s+range\s*\(\s*len\s*\('
  profile_signature:
    - "hot:indexed-iteration"
transformation:
  steps:
    - "Prefer `for item in x:` when the index isn't needed, or `for i, item in enumerate(x):` when it is. Both skip the repeated `x[i]` subscript lookup."
    - "`enumerate` returns a lazy iterator; `range(len(x))` builds no extra list but still does a dict lookup for `len` on every call - negligible but avoidable."
