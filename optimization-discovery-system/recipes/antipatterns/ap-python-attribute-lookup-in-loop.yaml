id: ap-python-attribute-lookup-in-loop
name: repeated attribute lookup inside a hot loop
category: caching
language: python
promotion: anti-pattern
trigger:
  ast_pattern: |
    (for_statement
      body: (block
        (expression_statement
          (call
            function: (attribute object: (attribute) @inner))))) @match
  profile_signature:
    - "hot:attr-lookup-per-iteration"
transformation:
  steps:
    - "Python resolves `obj.method.sub(...)` through multiple dict lookups. Bind the final callable to a local name *outside* the loop: `m = obj.method.sub` then call `m(...)` inside."
    - "The interpreter caches local names in a fast array; attribute chains go through the slower LOAD_ATTR path."
