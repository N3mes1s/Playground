id: ap-rust-string-push-str-concat
name: repeated String + &str concatenation
category: alloc-reduction
language: rust
promotion: anti-pattern
trigger:
  ast_pattern: |
    (call_expression
      function: (field_expression
        value: (call_expression
          function: (field_expression field: (field_identifier) @m1
            (#eq? @m1 "push_str")))
        field: (field_identifier) @m2 (#eq? @m2 "push_str"))) @match
  profile_signature:
    - "alloc:repeated-small-growth"
transformation:
  steps:
    - "Compute the total length up front, call `String::with_capacity(total)`, then append pieces. This avoids repeated reallocations."
    - "For joining slices of strings, prefer `<[&str]>::join` or `<[String]>::concat` -- the stdlib's impl allocates exactly once."
    - "When appending to a `Vec<u8>`, `extend_from_slice` is faster than `push_str` through a `String` wrapper."
