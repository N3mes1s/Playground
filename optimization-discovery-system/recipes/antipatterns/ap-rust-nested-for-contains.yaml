id: ap-rust-nested-for-contains
name: nested for with linear .contains() check
category: algorithmic
language: rust
promotion: anti-pattern
trigger:
  ast_pattern: 'for\s+[^{]+\{[^}]*\.contains\s*\('
  profile_signature:
    - "hot:O(n^2)-membership-check"
transformation:
  steps:
    - "Replace the inner `.contains()` on a `Vec` / slice with a `HashSet` lookup. Build the set once before the outer loop."
    - "If the set is small (<16 elements) and order matters, a sorted `Vec` + `binary_search` is sometimes faster than hashing."
