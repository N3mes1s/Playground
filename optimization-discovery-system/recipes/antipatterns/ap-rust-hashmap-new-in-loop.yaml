id: ap-rust-hashmap-new-in-loop
name: HashMap::new() allocated inside a loop
category: alloc-reduction
language: rust
promotion: anti-pattern
trigger:
  ast_pattern: |
    (for_expression
      body: (block
        (expression_statement
          (call_expression
            function: (scoped_identifier
              path: (identifier) @t (#eq? @t "HashMap")
              name: (identifier) @m (#match? @m "^(new|with_capacity)$")))))) @match
  profile_signature:
    - "alloc:loop-hashmap"
transformation:
  steps:
    - "Hoist the HashMap outside the loop; `.clear()` it between iterations to reuse the existing bucket storage."
    - "When the per-iteration map is small and keys are integer-like, consider a fixed-size lookup table or `SmallVec`-backed map instead."
