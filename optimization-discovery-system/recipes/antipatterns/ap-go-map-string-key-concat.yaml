id: ap-go-map-string-key-concat
name: map key built by string concatenation
category: alloc-reduction
language: go
promotion: anti-pattern
trigger:
  ast_pattern: |
    (index_expression
      index: (binary_expression
        left: (binary_expression operator: "+")
        operator: "+")) @match
  profile_signature:
    - "alloc:map-key-per-lookup"
transformation:
  steps:
    - "Concatenating strings to build a map key allocates on every access. Use a struct key (`struct{A, B string}`) or pre-compute the key outside the hot path."
    - "For numeric composite keys, a single `uint64` packed from two fields is dramatically cheaper than string building."
