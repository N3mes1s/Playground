id: ap-go-append-to-nil-slice
name: append to a nil slice with a known-ish final length
category: alloc-reduction
language: go
promotion: anti-pattern
trigger:
  ast_pattern: |
    (var_spec
      name: (identifier) @n
      type: (slice_type)) @match
  profile_signature:
    - "alloc:slice-growth"
transformation:
  steps:
    - "Preallocate with `make([]T, 0, expectedLen)` so the backing array doesn't reallocate as the slice grows."
    - "When the final length is exact, use `make([]T, expectedLen)` and index assignment instead of append."
