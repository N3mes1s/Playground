id: ap-go-string-bytes-roundtrip
name: string(bytes) / []byte(s) conversions in a hot loop
category: alloc-reduction
language: go
promotion: anti-pattern
trigger:
  ast_pattern: 'for\s+[^{]+\{[^}]*\bstring\(\[\]byte|\b\[\]byte\(\s*\w+\s*\)'
  profile_signature:
    - "alloc:string-byte-copy"
transformation:
  steps:
    - "`string([]byte)` and `[]byte(string)` both allocate + copy. In a hot loop that's O(n · iterations) extra work for no functional change."
    - "Keep the payload as `[]byte` throughout the loop. Convert once on exit if the caller really needs a `string`."
    - "When only substring matching is needed, `bytes` package counterparts (`bytes.Contains`, `bytes.HasPrefix`) skip the round-trip."
verification:
