id: ap-rust-metadata-is-dir
name: .metadata() to ask only is_dir / is_file
category: syscall-elimination
language: rust
promotion: anti-pattern
trigger:
  ast_pattern: '\.metadata\(\)[^;]*\.is_(dir|file|symlink)\(\)'
  profile_signature:
    - "syscall:stat-on-readdir-entry"
transformation:
  steps:
    - "`DirEntry::file_type()` returns the filetype cached from `readdir`'s `d_type` on platforms that support it, avoiding a `stat(2)` per entry."
    - "Fall back to `metadata()` only when d_type returns `Unknown`."
    - "For `Path::is_dir()` on a standalone path, `std::fs::symlink_metadata` is cheaper than `metadata` when symlinks don't need following."
