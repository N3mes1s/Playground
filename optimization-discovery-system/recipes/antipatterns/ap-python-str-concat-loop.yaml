id: ap-python-str-concat-loop
name: string concatenation with += inside a loop
category: alloc-reduction
language: python
promotion: anti-pattern
trigger:
  ast_pattern: |
    (for_statement
      body: (block
        (expression_statement
          (augmented_assignment
            left: (identifier) @lhs
            operator: "+=")))) @match
  profile_signature:
    - "alloc:string-growth-per-iteration"
transformation:
  steps:
    - "Python strings are immutable; `s += chunk` in a loop is O(n^2) because each step allocates and copies."
    - "Accumulate into a `list` then `\"\".join(list)` at the end -- one allocation, linear time."
    - "For byte streams, `io.BytesIO` is the idiomatic accumulator."
