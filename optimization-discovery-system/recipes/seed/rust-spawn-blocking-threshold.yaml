id: rust-spawn-blocking-threshold
name: spawn_blocking long synchronous CPU work inside async fns
category: algorithmic
language: rust
promotion: seed
trigger:
  ast_pattern: |
    (function_item
      (function_modifiers)
      name: (identifier) @fn
      body: (block
        (expression_statement
          (call_expression function: (scoped_identifier
            name: (identifier) @m
            (#match? @m "^(from_str|from_slice|compress|decompress)$")))))) @match
  profile_signature:
    - "tokio-console:poll_duration_p99>1ms"
    - "runtime:scheduler-park-latency-rising"
    - "runtime:timer-drift-or-accept-backlog"
  naive_alt_ratio_min: null
transformation:
  steps:
    - "Measure the synchronous block with `Instant::now()`; if p99 > 100 us reliably, it's starving the runtime."
    - "Wrap the CPU work in `tokio::task::spawn_blocking(move || cpu_work()).await?` -- moves it off the async worker."
    - "For mixed fast/slow inputs, branch on input size: fast path inline, slow path to `spawn_blocking`."
    - "Size the blocking pool via `Builder::new_multi_thread().max_blocking_threads(N)` -- default 512 is wrong for CPU-bound (use num_cpus)."
    - "Avoid `block_in_place` unless the runtime is multi-threaded and the caller cannot be restructured."
    - "Invariants: work is `Send + 'static`; doesn't re-enter the runtime via `.await`; at least a few hundred us of work to amortise ~5-15 us thread-handoff cost."
verification:
  test_selectors: ["async", "tokio"]
  property_seeds: []
  fuzz_minutes: 0
  semver_check: true
benchmark_template: ""
success_history: []
negative_history: []
generalized_from: null
generalized_as: null
