id: python-functools-cache
name: memoize pure hot functions with functools.cache
category: caching
language: python
promotion: seed
trigger:
  ast_pattern: |
    (function_definition
      name: (identifier) @fn
      body: (block
        (return_statement
          [
            (call)
            (binary_operator)
            (conditional_expression)
            (subscript)
          ]))) @match
  profile_signature:
    - "cprofile:ncalls>>unique-inputs"
    - "hot:function-dominates-self-time"
    - "recursion-or-loop-with-repeating-args"
  naive_alt_ratio_min: null
transformation:
  steps:
    - "Verify purity: no hidden global state, hashable arguments, deterministic output, no I/O side-effects. This is the only correctness gate."
    - "Decorate with `@functools.cache` when input domain is bounded, or `@functools.lru_cache(maxsize=N)` when unbounded to cap memory."
    - "For instance methods, move the pure core to a module-level helper and cache that -- decorating methods keeps `self` alive indefinitely."
    - "Invariants: pure function; hashable args; memory growth bounded when using lru_cache."
verification:
  test_selectors: []
  property_seeds: []
  fuzz_minutes: 0
  semver_check: true
benchmark_template: ""
