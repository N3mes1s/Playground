id: rust-aho-corasick-multi-pattern
name: Aho-Corasick automaton for repeated multi-literal search
category: caching
language: rust
promotion: seed
trigger:
  ast_pattern: '\.contains\s*\(\s*\w+\s*\)[^;]*\|\|[^;]*\.contains\s*\(|strings\.Contains\s*\([^)]*\)\s*\|\|'
  profile_signature:
    - "hot:N-fold-repeated-substring-scan"
    - "flamegraph:str::pattern|strings.Contains-sampled-many-times-per-outer-iter"
  naive_alt_ratio_min: null
transformation:
  steps:
    - "Build the automaton once outside the hot loop: `AhoCorasick::new(&patterns)?`."
    - "Use `find_iter(haystack)` for leftmost-first match, or `is_match()` for boolean OR."
    - "For <=1000 ASCII literals set `AhoCorasickKind::DFA` so the Teddy packed-SIMD prefilter fires."
    - "For Go use cloudflare/ahocorasick; for Java use org.ahocorasick.trie."
    - "Invariants: patterns are fixed literals (no regex metacharacters); automaton is reused across many haystacks so the O(sum(|pattern|)) build cost amortises."
verification:
  test_selectors: ["search", "match", "scan"]
  property_seeds: []
  fuzz_minutes: 5
  semver_check: true
benchmark_template: ""
success_history: []
negative_history: []
generalized_from: null
generalized_as: null
