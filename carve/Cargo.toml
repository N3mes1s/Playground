[package]
name = "carve"
version = "0.1.0"
edition = "2021"
description = "Supply-chain attack-surface reduction: carve out only the dependency code you actually use, transcribe it verbatim with full provenance, and stay reversible."
license = "MIT"

[[bin]]
name = "carve"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
cargo_metadata = "0.18"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
