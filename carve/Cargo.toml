[package]
name = "carve"
version = "0.1.0"
edition = "2021"
description = "Supply-chain control plane: vendor only the dependency code you use, as a small provenance-tracked reversible slice — making per-update vetting, CVE exceptions, and patching affordable."
license = "MIT"
readme = "README.md"
repository = "https://github.com/N3mes1s/Playground"
keywords = ["supply-chain", "vendoring", "security", "dependencies", "audit"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "carve"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
toml = "0.8"
cargo_metadata = "0.18"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ureq = { version = "2", features = ["json", "tls", "native-certs"] }
