name: Build Stage 2 Node runner image

# Builds infra/docker/node-runner.Dockerfile on Depot's BuildKit and
# saves it to `registry.depot.dev/lmpn2xx8kz:node-runner-latest`. This
# is the cached runner image consumed by run-stage2-cached.yml.
#
# Build is multi-stage:
#   A) kraft pkg pull unikraft.org/runtime/node:latest (FC variant)
#   B) npm install lodash, stage detonate.js
#   C) cpio newc archive of (B) -> rootfs.cpio
#   D) FC + util-linux + (A) kernel + (C) rootfs.cpio + boot script
#
# Trigger:
#   depot ci run --repo N3mes1s/Playground \
#     --workflow unikraft-firecracker-depot/.depot/workflows/build-node-runner.yml

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build node-runner image and save to Depot Registry
        uses: depot/build-push-action@v1
        with:
          project: lmpn2xx8kz
          token: ${{ secrets.AEGIS_DEPOT_TOKEN }}
          context: unikraft-firecracker-depot
          file: unikraft-firecracker-depot/infra/docker/node-runner.Dockerfile
          platforms: linux/amd64
          save: true
          save-tag: node-runner-latest
          push: false
