name: Boot Unikraft helloworld

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "unikraft-firecracker-depot/scripts/run_unikernel.sh"
      - "unikraft-firecracker-depot/.depot/workflows/unikraft-helloworld.yml"

jobs:
  boot:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    container:
      image: registry.depot.dev/<DEPOT_PROJECT_ID>:base-latest
      credentials:
        username: depot
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --device=/dev/net/tun
        --cap-add=NET_ADMIN
        --cap-add=NET_RAW
        --cap-add=SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    env:
      DEPOT_TOKEN: ${{ secrets.AEGIS_DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM passthrough
        run: |
          set -eux
          ls -l /dev/kvm
          firecracker --version
          kraft version || true

      - name: Stage unikernel binary
        run: |
          set -eux
          mkdir -p kernel
          depot pull --project <DEPOT_PROJECT_ID> --platform linux/amd64 \
            -t unikernel:local helloworld-uk-latest
          cid="$(docker create unikernel:local /kernel)"
          docker cp "$cid":/kernel kernel/helloworld_fc-x86_64
          docker rm "$cid"
          ls -lh kernel/

      - name: Boot unikernel under Firecracker
        run: |
          bash unikraft-firecracker-depot/scripts/run_unikernel.sh \
            kernel/helloworld_fc-x86_64
