name: Stage 1 — boot Unikraft helloworld (bootstrap, no registry cache)

# This workflow installs firecracker + kraft inline on every run.
# It exists so we can prove the boot path before a Depot project ID
# (needed for registry caching) is available. Once the project ID is
# wired in, prefer ci-base-image.yml + unikraft-helloworld.yml which
# reuse a cached base image and unikernel binary.

on:
  workflow_dispatch: {}

jobs:
  boot:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    container:
      # buildpack-deps:24.04-scm ships git so actions/checkout works
      # without an extra install step.
      image: buildpack-deps:24.04-scm
      options: >-
        --device=/dev/kvm
        --cap-add=SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v4

      - name: Use mirror.facebook.net for apt (archive.ubuntu.com is Cloudflare-blocked from Depot)
        run: |
          set -eux
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirror.facebook.net/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://mirror.facebook.net/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl jq xz-utils tar gzip uuid-runtime file

      - name: Verify KVM passthrough
        run: |
          set -eux
          ls -l /dev/kvm
          cat /proc/cpuinfo | grep -E '^(vmx|svm)' | head -n1 || true

      - name: Install Firecracker v1.15.0
        run: |
          set -eux
          curl -fsSL https://github.com/firecracker-microvm/firecracker/releases/download/v1.15.0/firecracker-v1.15.0-x86_64.tgz -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          install -m 0755 /tmp/release-v1.15.0-x86_64/firecracker-v1.15.0-x86_64 /usr/local/bin/firecracker
          firecracker --version

      - name: Install KraftKit
        run: |
          set -eux
          curl -sSf https://get.kraftkit.sh | sh -s -- -y
          # KraftKit installer drops the binary under /usr/local/bin by default
          which kraft
          kraft version

      - name: Pull and locate Unikraft helloworld binary
        run: |
          set -eux
          kraft pkg pull unikraft.org/helloworld:latest

          echo "=== kraft pkg ls ==="
          kraft pkg ls || true

          echo "=== kraftkit storage tree (top 30 by size) ==="
          for d in ~/.local/share/kraftkit ~/.config/kraftkit ~/.config/kraft ~/.kraftkit /var/kraftkit /var/lib/kraftkit; do
            [[ -d "$d" ]] && find "$d" -type f -printf '%s\t%p\n' 2>/dev/null
          done | sort -rn | head -30

          # kraft 0.12 stores the unikernel as an OCI blob under
          # ~/.local/share/kraftkit/oci/blobs/sha256/<hash>. Find it by
          # content (ELF64 x86-64) rather than filename. Both fc-x86_64
          # and qemu-x86_64 Unikraft builds are bootable by Firecracker.
          mapfile -t candidates < <(
            for d in ~/.local/share/kraftkit ~/.config/kraftkit ~/.config/kraft ~/.kraftkit /var/kraftkit /var/lib/kraftkit; do
              [[ -d "$d" ]] && find "$d" -type f -size +100k 2>/dev/null
            done
          )

          bin=""
          best_size=0
          for f in "${candidates[@]}"; do
            ft="$(file -b "$f" 2>/dev/null || true)"
            case "$ft" in
              *ELF*64-bit*x86-64*)
                sz="$(stat -c%s "$f")"
                echo "ELF: $f  size=$sz  -- $ft"
                if (( sz > best_size )); then
                  best_size=$sz
                  bin="$f"
                fi
                ;;
            esac
          done

          if [[ -z "$bin" ]]; then
            echo "ERROR: no ELF64 x86-64 candidate found under kraftkit storage" >&2
            exit 1
          fi

          cp "$bin" /tmp/helloworld
          file /tmp/helloworld
          ls -lh /tmp/helloworld

      - name: Boot unikernel under Firecracker
        run: |
          bash unikraft-firecracker-depot/scripts/run_unikernel.sh /tmp/helloworld
