name: Build Unikraft helloworld OCI image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "unikraft-firecracker-depot/infra/docker/helloworld-uk.Dockerfile"
      - "unikraft-firecracker-depot/.depot/workflows/unikraft-image.yml"

jobs:
  build:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.depot.dev/<DEPOT_PROJECT_ID>:base-latest
      credentials:
        username: depot
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
    env:
      DEPOT_TOKEN: ${{ secrets.AEGIS_DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull Unikraft helloworld unikernel
        run: |
          set -eux
          kraft pkg pull unikraft.org/helloworld:latest
          # KraftKit drops artifacts under ~/.config/kraft/pkg/manifests/
          # Find the firecracker-arch build (fall back to qemu-arch if needed;
          # both are ELF64 vmlinux and either should boot under FC).
          bin="$(find ~/.config/kraft -type f -name '*_fc-x86_64*' | head -n1 || true)"
          if [[ -z "$bin" ]]; then
            bin="$(find ~/.config/kraft -type f -name '*_qemu-x86_64*' | head -n1 || true)"
          fi
          if [[ -z "$bin" ]]; then
            echo "ERROR: could not locate a Unikraft helloworld binary" >&2
            find ~/.config/kraft -type f >&2 || true
            exit 1
          fi
          cp "$bin" unikraft-firecracker-depot/infra/docker/helloworld_fc-x86_64
          ls -lh unikraft-firecracker-depot/infra/docker/helloworld_fc-x86_64

      - name: Build and save unikernel image to Depot Registry
        uses: depot/build-push-action@v1
        with:
          project: <DEPOT_PROJECT_ID>
          token: ${{ secrets.AEGIS_DEPOT_TOKEN }}
          context: unikraft-firecracker-depot/infra/docker
          file: unikraft-firecracker-depot/infra/docker/helloworld-uk.Dockerfile
          platforms: linux/amd64
          save: true
          save-tag: helloworld-uk-latest
          push: false
