name: Stage 2 — detonate require("lodash") in Unikraft Node under FC

# Pulls the cached node-runner image (firecracker + Node unikernel +
# rootfs.cpio with detonate.js + lodash + boot script) and runs the
# detonation. The boot script parses the JSON verdict between
# DETONATE_JSON_BEGIN/END markers in the serial console.

on:
  workflow_dispatch: {}

jobs:
  detonate:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    container:
      image: registry.depot.dev/lmpn2xx8kz:node-runner-latest
      credentials:
        username: x-token
        password: ${{ secrets.AEGIS_DEPOT_TOKEN }}
      options: >-
        --device=/dev/kvm
        --cap-add=SYS_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Verify image and KVM passthrough
        run: |
          set -eux
          ls -l /dev/kvm
          firecracker --version
          file /opt/unikraft/node
          ls -lh /opt/unikraft/node /opt/unikraft/rootfs.cpio /opt/run_node_unikernel.sh

      - name: Detonate require("lodash") inside the unikernel
        run: |
          bash /opt/run_node_unikernel.sh \
            /opt/unikraft/node \
            /opt/unikraft/rootfs.cpio
