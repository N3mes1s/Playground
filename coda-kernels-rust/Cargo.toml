[package]
name = "coda-rs"
version = "0.1.0"
edition = "2021"
description = "A faithful CPU/Rust port of CODA: Transformer blocks as GEMM-plus-epilogue programs"

[lib]
name = "coda"
path = "src/lib.rs"

[[bin]]
name = "coda-demo"
path = "src/main.rs"

# GPU verification + benchmark binary. Build with `--features cuda`.
[[bin]]
name = "coda-gpu"
path = "src/bin/gpu.rs"

# Pretrained-model (OpenLLaMA-3B) inference binary. Build with `--features cuda`.
[[bin]]
name = "coda-llm"
path = "src/bin/llm.rs"

[features]
# Enables the CUDA backend (`src/cuda.rs` + `cuda/coda_kernels.cu`, compiled
# by `build.rs` via nvcc). Off by default so the crate builds with no GPU.
cuda = []

[profile.release]
opt-level = 3
lto = true
