[project]
name = "session-teleport"
version = "0.1.0"
description = "Teleport Claude Code and Codex CLI sessions between machines"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "cryptography>=41.0",
    "rich>=13.0",
]

[project.optional-dependencies]
relay = ["aiohttp>=3.9"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.15", "ty>=0.0.26"]

[project.scripts]
session-teleport = "session_teleport.cli:main"
stp = "session_teleport.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM115"]  # context manager for tarfile handled by __enter__/__exit__

[tool.ty.environment]
python-version = "3.10"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
